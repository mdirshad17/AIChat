name: Deploy Spring Boot to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Project
        run: ./gradlew build -x test

      - name: Stage files for SCP
        run: |
          mkdir -p deploy-stage
          find build/libs -maxdepth 1 -name "*.jar" ! -name "*-plain.jar" -exec cp {} deploy-stage/app.jar \;
          cp deploy.sh deploy-stage/
          cp newrelic.jar deploy-stage/ || true
          cp newrelic.yml deploy-stage/ || true

      - name: Copy Files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy-stage/*"
          target: "~/"
          strip_components: 1

      - name: Execute Deployment on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            printf '%s' '${{ secrets.ENV_FILE_CONTENT }}' > ~/.env
            chmod +x ~/deploy.sh
            echo "~/deploy.sh" | at now