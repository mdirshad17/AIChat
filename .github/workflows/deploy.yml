name: Deploy Spring Boot to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Project
        run: ./gradlew build -x test

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar,newrelic.jar,newrelic.yml"
          target: "~/"
          strip_components: 1

      - name: Execute Deployment Scripts on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Create the .env file from GitHub Secrets
            echo "${{ secrets.ENV_FILE_CONTENT }}" > ~/.env
            
            # 2. Stop any running instance of the app
            pkill -f 'java -jar' || true
            
            # 3. Load environment variables and start the new app
            set -a
            source ~/.env
            set +a
            
            nohup java -javaagent:newrelic.jar -jar *.jar > app.log 2>&1 < /dev/null &
            sleep 2
            exit 0